name: Dev Pipeline

on:
  workflow_call:
    inputs:
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: 'false'
        type: string

env:
  ACR_NAME: myacrlab12345
  ACR_LOGIN_SERVER: myacrlab12345.azurecr.io
  IMAGE_NAME: app

permissions:
  id-token: write
  contents: write

jobs:
  build-push:
    runs-on: [self-hosted, linux, aks]
    outputs:
      image-tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA:0:4}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          build-args: |
            ASPNETCORE_ENVIRONMENT=Development
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout from Azure
        if: always()
        run: az logout

  scan:
    needs: build-push
    runs-on: [self-hosted, linux, aks]
    
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: [build-push, scan]
    runs-on: [self-hosted, linux, aks]
    env:
      NAMESPACE: testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AKS
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}"
          echo "Deploying image: $IMAGE"
          
          # Update image in deployment.yaml
          sed -i "s|image: .*|image: $IMAGE|g" k8s/deployment.yaml
          
          # Apply deployment
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/deployment.yaml
          
          # Wait for rollout
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Commit updated deployment.yaml
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image to $IMAGE [skip ci]"
          git pull --rebase origin dev
          git push origin dev

  rollback:
    needs: [build-push, scan]
    runs-on: [self-hosted, linux, aks]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback == 'true'
    env:
      NAMESPACE: testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous deployment..."
          kubectl rollout undo deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Get current image after rollback
        run: |
          CURRENT_IMAGE=$(kubectl get deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Current image after rollback: $CURRENT_IMAGE"
          
          # Update deployment.yaml with the rolled-back image
          sed -i "s|image: .*|image: $CURRENT_IMAGE|g" k8s/deployment.yaml

      - name: Commit rolled-back deployment.yaml
        run: |
          CURRENT_IMAGE=$(kubectl get deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "rollback: revert to $CURRENT_IMAGE [skip ci]"
          git pull --rebase origin dev
          git push origin dev

      - name: Verify Rollback
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.IMAGE_NAME }}
          kubectl get service -n ${{ env.NAMESPACE }} ${{ env.IMAGE_NAME }}

      - name: Verify Deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.IMAGE_NAME }}
          kubectl get service -n ${{ env.NAMESPACE }} ${{ env.IMAGE_NAME }}

name: Dev Pipeline

on:
  workflow_call:

env:
  ACR_NAME: myacrlab12345
  ACR_LOGIN_SERVER: myacrlab12345.azurecr.io
  IMAGE_NAME: app
  RESOURCE_GROUP: aia-mi
  AKS_CLUSTER_NAME: thss

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA:0:4}" >> $GITHUB_OUTPUT

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          build-args: |
            ASPNETCORE_ENVIRONMENT=Development
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Deploy to AKS
        run: |
          # Replace image placeholder with actual image
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}|g" k8s/deployment.yaml
          
          # Apply deployment (skip validation for private cluster)
          kubectl apply -n testing -f k8s/deployment.yaml --validate=false
          
          # Wait for rollout
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} -n testing --timeout=120s

      - name: Verify Deployment
        run: |
          kubectl get pods -n testing -l app=${{ env.IMAGE_NAME }}
          kubectl get service -n testing ${{ env.IMAGE_NAME }}

      - name: Logout from Azure
        if: always()
        run: az logout

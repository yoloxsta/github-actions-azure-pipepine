name: Dev Pipeline

on:
  workflow_call:

env:
  ACR_NAME: myacrlab12345
  ACR_LOGIN_SERVER: myacrlab12345.azurecr.io
  IMAGE_NAME: app

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: self-hosted
    outputs:
      image-tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=dev-${GITHUB_SHA:0:4}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          build-args: |
            ASPNETCORE_ENVIRONMENT=Development
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout from Azure
        if: always()
        run: az logout

  scan:
    needs: build-push
    runs-on: self-hosted
    
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy:
    needs: [build-push, scan]
    runs-on: self-hosted
    env:
      NAMESPACE: testing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AKS
        run: |
          # Replace image placeholder
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.image-tag }}|g" k8s/deployment.yaml
          
          # Apply deployment
          kubectl apply -n ${{ env.NAMESPACE }} -f k8s/deployment.yaml
          
          # Wait for rollout
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Verify Deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.IMAGE_NAME }}
          kubectl get service -n ${{ env.NAMESPACE }} ${{ env.IMAGE_NAME }}

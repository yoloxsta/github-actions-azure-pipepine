name: Rollback Deployment

on:
  workflow_dispatch:

env:
  # ACR Configuration
  ACR_LOGIN_SERVER: myacrlab12345.azurecr.io
  IMAGE_NAME: app
  # AKS Dev Cluster Configuration
  AKS_CLUSTER_NAME: thss
  AKS_RESOURCE_GROUP: aia-mi
  NAMESPACE: testing

permissions:
  id-token: write
  contents: write

jobs:
  rollback:
    runs-on: [self-hosted, linux, aks]
    
    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: yoloxsta/github-actions-azure-k8s-manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          ref: dev

      - name: Rollback to previous version
        run: |
          echo "========================================"
          echo "  ROLLING BACK DEPLOYMENT"
          echo "========================================"
          echo "  Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "  Namespace: ${{ env.NAMESPACE }}"
          echo "========================================"
          
          kubectl rollout undo deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Get current image after rollback
        id: get-image
        run: |
          CURRENT_IMAGE=$(kubectl get deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
          echo ""
          echo "========================================"
          echo "  ROLLBACK COMPLETE"
          echo "========================================"
          echo "  Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "  Namespace: ${{ env.NAMESPACE }}"
          echo "  Current Image: $CURRENT_IMAGE"
          echo "========================================"

      - name: Update deployment.yaml
        run: |
          CURRENT_IMAGE="${{ steps.get-image.outputs.CURRENT_IMAGE }}"
          sed -i "s|image: .*|image: $CURRENT_IMAGE|g" deployment.yaml

      - name: Commit rolled-back manifest
        run: |
          CURRENT_IMAGE="${{ steps.get-image.outputs.CURRENT_IMAGE }}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add deployment.yaml
          git commit -m "rollback: revert to $CURRENT_IMAGE [skip ci]"
          git pull --rebase origin dev
          git push origin dev

      - name: Verify Rollback
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.IMAGE_NAME }}
          kubectl get service -n ${{ env.NAMESPACE }} ${{ env.IMAGE_NAME }}

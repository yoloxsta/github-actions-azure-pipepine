name: Rollback Deployment

on:
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: myacrlab12345.azurecr.io
  IMAGE_NAME: app
  NAMESPACE: testing

permissions:
  id-token: write
  contents: write

jobs:
  rollback:
    runs-on: [self-hosted, linux, aks]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous deployment..."
          kubectl rollout undo deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Get current image after rollback
        id: get-image
        run: |
          CURRENT_IMAGE=$(kubectl get deployment/${{ env.IMAGE_NAME }} -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "CURRENT_IMAGE=$CURRENT_IMAGE" >> $GITHUB_OUTPUT
          echo ""
          echo "========================================"
          echo "  ROLLBACK COMPLETE"
          echo "========================================"
          echo ""
          echo "  Current Image: $CURRENT_IMAGE"
          echo ""
          echo "========================================"

      - name: Update deployment.yaml
        run: |
          CURRENT_IMAGE="${{ steps.get-image.outputs.CURRENT_IMAGE }}"
          sed -i "s|image: .*|image: $CURRENT_IMAGE|g" k8s/deployment.yaml

      - name: Commit rolled-back deployment.yaml
        run: |
          CURRENT_IMAGE="${{ steps.get-image.outputs.CURRENT_IMAGE }}"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "rollback: revert to $CURRENT_IMAGE [skip ci]"
          git pull --rebase origin dev
          git push origin dev

      - name: Verify Rollback
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.IMAGE_NAME }}
          kubectl get service -n ${{ env.NAMESPACE }} ${{ env.IMAGE_NAME }}
